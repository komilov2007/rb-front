name: Deployment workflow
on:
  push:
    branches: ["dev"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    name: Build an image and Deploy to K8S
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Create file from environment variable
        run: |
          echo "${{ vars.DEV_ENV }}" > .env
          cat .env

      - name: Login to the Container Registry
        uses: docker/login-action@f054a8b539a109f9f41c372932f1ae047eff08c9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@98669ae865ea3cffbcbaa878cf57c20bbf1c6c38
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Prepare image name
        run: |
          echo "IMAGE_IN_LOWER=${IMAGE_NAME@L}" >> "${GITHUB_ENV}"

      - name: Build and push Docker image
        uses: docker/build-push-action@ad44023a93711e3deb337508980b4b5e9bcdc5dc
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_IN_LOWER }}:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Set up kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config

      - name: Update Kubernetes Deployment
        run: |
          kubectl apply -f .kube/dev.yml -n dev
          kubectl set image deployment/frontend frontend=${{ env.REGISTRY }}/${{ env.IMAGE_IN_LOWER }}:${{ github.sha }} -n dev